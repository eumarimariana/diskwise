[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "diskwise"
dynamic = ["version"]
description = "Find out what's taking up space on your disk and clean it up safely, file by file."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/eumarimariana/diskwise"

[project.scripts]
diskwise = "diskwise.__main__:main"

[tool.setuptools]
packages = ["diskwise"]

[tool.setuptools.package-data]
diskwise = ["static/*", "static/vendor/*"]

[tool.setuptools.dynamic]
version = { attr = "diskwise.__version__" }
